<!DOCTYPE html>
<html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leveling Jump</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="imagenes/logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="imagenes/logo.png">
  
  <style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
  body{
    background:#e5e7eb; /* gris más marcado */
    color:#0f172a;
  }
  
  
  /* HEADER */
  header{
    background:#ffffff;
      padding:16px 24px; /* ⬅️ ANTES 28px */
    color:#0f172a;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
  }
  
  .header-top{display:flex;align-items:center;gap:20px}
  .logo{height:180px;cursor:pointer}
  .search-area{flex:1;display:flex;gap:10px}
  .search-area input{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    background:#374151;   /* gris oscuro */
    color:#ffffff;        /* texto blanco */
  }
  
  /* Texto del placeholder */
  .search-area input::placeholder{
    color:#d1d5db;
  }
  
  /* Cuando haces clic */
  .search-area input:focus{
    outline:none;
    background:#1f2937;   /* un poco más oscuro */
  }
  
  .cat-btn{padding:12px 16px;border:none;border-radius:14px;font-size:22px;background:#334155;color:white}
  .icons{display:flex;gap:14px;align-items:center}
  
  /* CART ICON */
  .cart-icon{position:relative;font-size:22px;cursor:pointer;transition:.3s}
  .cart-icon.bounce{animation:bounce .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-3px)}
    75%{transform:translateX(3px)}
  }
  
  .cart-icon.shake{
    animation:shake .3s;
  }
  @keyframes bounce{
    0%{transform:scale(1)}
    50%{transform:scale(1.25)}
    100%{transform:scale(1)}
  }
  .cart-count{
    position:absolute;top:-6px;right:-10px;
    background:#dc2626;color:white;
    font-size:12px;padding:2px 6px;border-radius:50%
  }
  
  /* CATEGORIES */
  #categories{
    display:none;position:absolute;top:230px;left:50%;
    transform:translateX(-50%);
    background:white;width:300px;border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:10;color:#0f172a;
  }
    
  /* Items del menú de categorías */
  #categories div{
    display:flex;
    flex-direction:row;   /* ⬅️ CLAVE */
    align-items:center;
    gap:12px;
  
    padding:14px 16px;
    font-size:18px;
    font-weight:600;
  }
  
  
  .brand-logo{
    width:36px;
    height:36px;
    min-width:36px;
    min-height:36px;
    object-fit:contain;
    display:block;
  }
  
  .product-name-wrap{
    display:flex;
    align-items:center;
    gap:6px;
  }
  
  
  #categories div:hover{background:#e2e8f0}
  
  /* MAIN */
  main{padding:24px}
  .section{margin-bottom:40px}
  .section-title{
    display:flex;
    align-items:center;
    gap:12px;
  
    font-size:26px;          /* ⬅️ MÁS GRANDE */
    font-weight:700;
  
    margin-bottom:18px;
    padding-left:10px;
    border-left:6px solid #0ea5e9;
  }
  
  .section-brand-logo{
    width:42px;
    height:42px;
    min-width:42px;
    min-height:42px;
    object-fit:contain;
  }
  
  
  
  /* SLIDER */
  .slider{position:relative}
  .track{display:flex;gap:16px;overflow:hidden;scroll-behavior:smooth}
  .arrow {
    position: absolute;
    top: 45%;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 20px;
    cursor: pointer;
    z-index: 5;
    display: none; /* Se controla por JS */
  }
  
  
  .arrow.left{left:-18px}
  .arrow.right{right:-18px}
  
  /* CARD */
  .card{
    background:#ffffff;
    width:220px;
    min-width:220px;
    border-radius:18px;
    padding:14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    gap:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.10);
    opacity:1;
    transform:scale(1);
    min-height:400px; /* 👈 CLAVE */
  }
  
  /* 👇 ANIMACIÓN TIKTOK */
  @keyframes tiktokPop{
    0%{transform:scale(.7); opacity:0}
    60%{transform:scale(1.08); opacity:1}
    100%{transform:scale(1)}
  }
  
  .card.show{
    animation:tiktokPop .35s ease forwards;
  }
  
  .card:hover{
    transform:scale(1.05);
    box-shadow:0 20px 45px rgba(0,0,0,.2);
  }
  .card.disabled{opacity:.45;pointer-events:none}
  .card img{width:100%;height:140px;object-fit:contain;cursor:pointer}
  .card h3{font-size:14px;margin:8px 0;min-height:36px;cursor:pointer}
  .price{font-weight:700;color:#16a34a}
  .old-price{text-decoration:line-through;color:#64748b;margin-right:6px}
  
  /* BADGES */
  .discount-badge{position:absolute;top:10px;left:10px;background:#dc2626;color:white;font-size:12px;padding:4px 8px;border-radius:10px}
  @keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:.3}
  }
  
  .last-unit{
    position:absolute;
    top:10px;
    right:10px;
    background:linear-gradient(45deg,#ff4d4d,#ff0000);
    color:white;
    font-size:12px;
    padding:4px 10px;
    border-radius:999px;
    font-weight:600;
    animation:tiktokPulse 1.2s ease-in-out infinite;
  }
  
  @keyframes tiktokPulse{
    0%{
      transform:scale(1);
      box-shadow:0 0 0 0 rgba(255,0,0,0.6);
    }
    50%{
      transform:scale(1.08);
      box-shadow:0 0 10px 4px rgba(255,0,0,0.2);
    }
    100%{
      transform:scale(1);
      box-shadow:0 0 0 0 rgba(255,0,0,0);
    }
  }
  .out-stock{position:absolute;top:10px;right:10px;background:#6b7280;color:white;font-size:12px;padding:4px 8px;border-radius:10px}
  
  /* QTY */
  .qty{display:flex;justify-content:center;gap:8px;margin:6px 0}
  .qty button{width:28px;height:28px;border:none;border-radius:6px;background:#334155;color:white;cursor:pointer;transition:.2s}
  .qty button:active{transform:scale(.92)}

  .cart-item .qty{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
  flex-shrink:0; /* 👈 evita que desaparezca */
}

.cart-item .qty button{
  width:28px;
  height:28px;
  font-size:16px;
  background:#1e293b;
  color:#fff;
  border:none;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-item .qty span{
  min-width:20px;
  text-align:center;
  font-weight:600;
}
  
  /* BUTTONS */
  .add-btn,.buy-btn{
    height:38px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:.2s;
    width:100%;
    margin-top:6px;
    position:relative;
    overflow:visible;
  
    z-index: 5;
  
    display:flex;              /* 👈 CLAVE */
    align-items:center;        /* 👈 CLAVE */
    justify-content:center;    /* 👈 CLAVE */
    gap:6px;                   /* 👈 CLAVE */
  }
    
  .buy-btn{
    background:#25d366;
    color:#fff;
  }
  
  .buy-btn:hover{
    background:#1ebe5d;
  }
  
  .buy-btn img{
    width:16px;
    height:16px;
    object-fit:contain;
  }
  
  .buy-btn:active{
    transform:scale(.92);
  }
  
  /* efecto onda */
  .add-btn::after,
  .buy-btn::after{
    content:"";
    position:absolute;
    width:0;
    height:0;
    background:rgba(255,255,255,.4);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:0; /* 👈 CLAVE */
    transition:.4s;
  }
  
  .add-btn span,
  .buy-btn span{
    position:relative;
    z-index:1;
  }
  
  .add-btn:active::after,
  .buy-btn:active::after{
    width:200%;
    height:200%;
  }
  
  /* DETAIL */
  #detail{display:none}
  .back-btn img{width:36px;cursor:pointer;margin-bottom:16px}
  .detail-box{
    display:flex;gap:28px;background:white;
    padding:24px;border-radius:22px;
    align-items:center;justify-content:center
  }
  .detail-box img{width:280px}
  .detail-info{max-width:360px}
  
    /* SLIDER IMÁGENES DETALLE */
  .detail-slider{
    width:100%;
    max-width:1000px;   /* 👈 mismo valor */
    margin:0 auto;
    overflow:hidden;
  }
  
  .detail-track{
    display:flex;
    transition: transform .45s ease;
  }
  
  .detail-img{
    flex: 0 0 100%; /* ⬅️ cada imagen ocupa 100% del ancho del slider */
    width:100%;
    max-width:1000px;
    user-select:none;
    pointer-events:auto;
    transform-origin: 50% 50%;
    cursor: zoom-in;
    transition: transform .3s ease;
  }
  
  .detail-img.zoomed{
    transform: scale(3);
    cursor: zoom-out;
  }
  
  @media(max-width:768px){
    .detail-img{
      max-width:100%;
    }
  
    .detail-img.zoomed{
      transform: scale(2);
    }
  }
  
  .detail-slider img{
    width:100%;
    border-radius:14px;
  }
  
  .slider-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,.5);
    color:white;
    border:none;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
  }
  
  .slider-btn.prev{left:6px}
  .slider-btn.next{right:6px}
  
  .detail-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:8px;
    padding-bottom:6px; /* 👈 AQUÍ */
  }
  
  .detail-dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#cbd5e1;
    cursor:pointer;
  }
  
  .detail-dots span.active{
    background:#0ea5e9;
  }
  
  /* CART */
  #cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:49; /* 👈 CLAVE */
}
  #cart-overlay.active{display:block}
  #cart{
    position:fixed;
    right:0;
    top:0;
    width:420px;
    height:100%;
    background:white;
    padding:20px;
  
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.68,-0.55,.27,1.55);
    z-index:50;
  }

#closeCartBtn{
  position:absolute;
  top:10px;
  right:10px;
  background:none;
  border:none;
  font-size:24px;
  cursor:pointer;
  color:#0f172a;
}
    
  #cart.active{
    transform:translateX(0);
  }
  /* CATEGORIES OVERLAY */
  #categories-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:transparent;
    z-index:9;
  }
  #categories-overlay.active{
    display:block;
  }
  
.cart-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:14px;
}

/* 👇 AÑADE ESTO AQUÍ */
.cart-item > div{
  flex:1;
  min-width:0;
}

.cart-item > div{
  flex:1;
  min-width:0;
  overflow:hidden;
}

.cart-item > div > div:first-child{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
    
  .cart-item small{color:#dc2626}
  .cart-item button{border:none;background:none;cursor:pointer}
  
  /* MOBILE */
  @media(max-width:768px){
    .detail-box{flex-direction:column}
    .detail-box img{width:100%}
  }
  
  @media (max-width: 768px){
  
    /* HEADER */
    .header-top{
      flex-wrap: wrap;
      gap: 12px;
    }
  
    .logo{
      height: 110px;
      margin: 0 auto;
    }
  
    .search-area{
      width: 100%;
    }
  
    .icons{
      width: 100%;
      justify-content: center;
    }
  
    /* SLIDER */
    .track{
      overflow-x: auto;
      padding-bottom: 10px;
    }
  
    .arrow{
      display: none !important; /* flechas fuera en móvil */
    }
  
    /* CARDS */
    .card{
      width: 160px;
      min-width: 160px;
    }
  
    .card img{
      height: 110px;
    }
  
    .card h3{
      font-size: 13px;
    }
  
    /* DETAIL */
    .detail-box{
      padding: 16px;
      gap: 16px;
    }
  
    .detail-info{
      text-align: center;
    }
  
    /* CART */
    #cart{
      width: 100%;
    }
  
      /* GRID CATEGORÍAS: 2 columnas en móvil */
    .grid-products {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
  
    
  }
  
  
  /* ===============================
     GRID + PAGINACIÓN POR CATEGORÍA
  ================================ */
  .grid-products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
  }
  
  /* =========================
     Precio detalle más grande
  ========================= */
  .detail-info .price {
    font-size: 32px;    /* grande en desktop */
    font-weight: 700;
    color: #16a34a;
    margin: 10px 0;
  }
  
  /* Botón Volver al lado izquierdo del slider solo en detalle */
  .detail-box .back-btn {
    position: absolute;       /* lo posicionamos sobre el slider */
    left: 8px;                /* espacio desde la izquierda */
    top: 50%;                 /* centrado verticalmente */
    transform: translateY(-50%); /* centrado exacto */
    z-index: 10;              /* encima de la imagen */
    cursor: pointer;
  }
  
  .detail-box .back-btn img {
    width: 32px;              /* tamaño del icono */
    height: 32px;
  } 
  
  /* ⬅️ SOLO DETALLE DEL PRODUCTO */
  .detail-info .qty button {
    width:40px;       /* antes 28px */
    height:40px;      /* antes 28px */
    font-size:18px;   /* tamaño de + y - */
  }
  
  .detail-info .qty .q-span {
    font-weight: 700;
    font-size:28px;   /* tamaño del número central */
    min-width:30px;
    text-align:center;
  }
  
  /* ⬅️ SOLO DETALLE DEL PRODUCTO */
  .detail-info .add-btn,
  .detail-info .buy-btn {
    height:50px;      /* antes 38px */
    font-size:16px;   /* texto más grande */
    gap:10px;         /* más espacio entre icono y texto en comprar ahora */
  }
    
  /* Ajuste para móviles */
  @media(max-width:768px){
    .detail-info .price {
      font-size: 24px;   /* más pequeño en móviles */
    }
    .detail-info .qty .q-span {
    font-weight: 700;  /* sigue en negrita */
    font-size: 20px;   /* tamaño adecuado para móvil */
    }
    .detail-box .back-btn {
    left: 4px;
    top: 4px;
    transform: none;
    }
    .detail-box .back-btn img {
    width: 28px;
    height: 28px;
    }
 } 
    
  .pagination{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:24px;
  }
  
  .pagination button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#e5e7eb;
    cursor:pointer;
    font-weight:600;
  }
  
  .pagination button.active{
    background:#0ea5e9;
    color:white;
  } 
    
  </style>
  </head>
  
  <body>
  
  <header>
    <div class="header-top">
      <img src="imagenes/logo.png" class="logo" onclick="goHome()">
      <div class="search-area">
        <input id="search" placeholder="Buscar modelos..." oninput="renderAll()">
        <button class="cat-btn" onclick="toggleCategories()">☰</button>
      </div>
      <div class="icons">
        <!-- Iconos sociales junto al carrito -->
        <a href="https://wa.me/51963204461" target="_blank"><img src="imagenes/whatsapp-logo.png" style="width:28px;"></a>
        <a href="https://www.tiktok.com/@leveling_jump?is_from_webapp=1&sender_device=pc" target="_blank"><img src="imagenes/TikTok.webp" style="width:28px;"></a>
        <div class="cart-icon" onclick="toggleCart(true)">
          🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
      </div>
    </div>
    <div id="categories"></div>
  </header>
  
  <div id="categories-overlay" onclick="closeCategories()"></div>
  <main>
    <div id="catalog"></div>
    <div id="detail"></div>
  </main>
  
  <div id="cart-overlay" onclick="toggleCart(false)"></div>
  <div id="cart">
    <button type="button" id="closeCartBtn">✕</button>
    <!-- MODAL CHECKOUT -->
  <div id="checkoutModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:9999;
    align-items:center;
    justify-content:center;
  ">
    <div style="
      background:white;
      padding:22px;
      border-radius:16px;
      width:90%;
      max-width:420px;
    ">
      <h3 style="margin-bottom:10px">🧾 Datos del pedido</h3>
  
      <input id="customerNameInput"
        placeholder="Nombre completo"
        style="width:100%;padding:10px;margin:6px 0">
  
      <input id="customerPhoneInput"
        placeholder="Celular"
        style="width:100%;padding:10px;margin:6px 0">
  
      <button
        style="width:100%;padding:12px;margin-top:10px;background:#25d366;color:white;border:none;border-radius:10px"
        onclick="confirmCheckout()">
        Confirmar pedido
      </button>
    </div>
  </div>
  
    <h2>Carrito <small id="cartTimer"></small></h2>
    <div id="cartItems"></div>
    <strong>Total: S/ <span id="cartTotal">0</span></strong>
    <button class="buy-btn" id="checkoutBtn" onclick="openCheckoutModal()">Finalizar por WhatsApp</button>
  
  </div>
  
  <!-- ==== Módulo único para Firebase y todo el JS ==== -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    getDoc,
    addDoc,
    serverTimestamp,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  
  // Config Firebase
  const firebaseConfig = {
    apiKey : "AIzaSyDX7NDV2iphl0eoWDOSqlc60MzoDOrimdk" , 
    authDomain : "levelingjump-d1e78.firebaseapp.com" , 
    projectId : "levelingjump-d1e78" , 
    storageBucket : "levelingjump-d1e78.firebasestorage.app" , 
    messagingSenderId : "534283044344" , 
    appId : "1:534283044344:web:5278a6f2271bc7252f820d"
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  // Variables globales
  let DATA = {}, CART = JSON.parse(localStorage.getItem("cart") || "{}");
  let currentPage = 1;
  const PAGE_SIZE = 16; // ← puedes cambiar a 15 o 20
  // Slider detalle producto
  let detailIndex = 0;
  let detailTimer = null;
  
  const BRAND_LOGOS = {
    "pokemon": "imagenes/brands/Pokemon.jpg",
    "zoids": "imagenes/brands/Zoids.webp",
    "digimon": "imagenes/brands/Digimon.png",
    "gundam": "imagenes/brands/Gundam.png"
  };
  
  //const RESERVE_TIME=60*60*1000; // 1 hora
  let cartTimeout;
  let checkoutInProgress = false;
  let checkoutConfirmed = sessionStorage.getItem("checkoutConfirmed") === "1";
  
  const catalog = document.getElementById("catalog");
  const detail = document.getElementById("detail");
  const search = document.getElementById("search");
  const categories = document.getElementById("categories");
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");
  const cartCount = document.getElementById("cartCount");
  const cartTimer = document.getElementById("cartTimer");
  const CART_TIMEOUT = 3 * 60 * 60 * 1000; // 3 horas
  
  
  function listenProductsRealtime() {
    const ref = collection(db, "products");
  
    onSnapshot(ref, (snapshot) => {
      DATA = {}; // reset limpio
  
      snapshot.forEach(docu => {
        const p = { id: docu.id, ...docu.data() };
  
        // 🔒 Evitar documentos basura (ej: init)
        if (
          !p.name ||
          !p.category ||
          typeof p.price !== "number" ||
          typeof p.stock !== "number"
        ) return;
  
        // ❌ NO mostrar productos inactivos
        if (p.active === false) return;
  
        if (!DATA[p.category]) DATA[p.category] = [];
  
        p._qty = 1;
        DATA[p.category].push(p);
      });
  
      buildCategories();
      renderAll();
    });
  }
  
    
  // ==== Función para traer productos desde Firestore ====
  //async function loadProductsFromFirestore() {
  //const snapshot = await getDocs(collection(db, "products"));
  //const products = [];
  //snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
  //return products;
  //}
  
  async function reserveStock(productId, qty) {
    const ref = doc(db, "products", productId);
  
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(ref);
        if (!snap.exists()) throw "Producto no existe";
  
        const data = snap.data();
  
        if (data.stock < qty) {
          throw "Stock insuficiente";
        }
  
        transaction.update(ref, {
          stock: data.stock - qty
        });
      });
  
      return true;
    } catch (e) {
      console.warn("❌ No se pudo reservar stock:", e);
      return false;
    }
  }
  
  async function releaseStock(productId, qty){
    try{
      await runTransaction(db, async (tx)=>{
        const ref = doc(db, "products", productId);
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
  
        const stock = snap.data().stock || 0;
        tx.update(ref, { stock: stock + qty });
      });
    }catch(e){
      console.error("Error liberando stock", e);
    }
  }
  
  
  async function confirmStock(){
    for(const item of Object.values(CART)){
      const ref = doc(db, "products", item.id);
  
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
  
        const stock = snap.data().stock ?? 0;
  
        // 🔒 stock ya fue descontado, solo aseguramos que no se libere
        tx.update(ref, { stock });
      });
    }
  }

      img.style.transformOrigin = `${x}% ${y}%`;

      img.style.transformOrigin = "50% 50%";

      }
      lastTap = now;
    });
  });

  const now = Date.now();

  let count = 0;
  let minTime = Infinity;

  Object.values(CART).forEach(p=>{
    const left = CART_TIMEOUT - (now - p.time);

    if(left > 0){
      count += p.qty;
      minTime = Math.min(minTime, left);
    }
  });

  if(count <= 0){
    cartTimer.innerText = "";
    return;

  const minLeft = Math.floor(minTime / 60000);
  const secLeft = Math.floor((minTime % 60000) / 1000);

  const format = n => n.toString().padStart(2,"0");

  cartTimer.innerText =
    `(${format(minLeft)}:${format(secLeft)})`;

  if(!item) return;

  if(delta > 0){
    const ok = await reserveStock(item.id, 1);
    if(!ok){
      alert("Sin stock");
      return;
    }
    item.qty++;
  } else {
    item.qty--;
    await releaseStock(item.id, 1);

    if(item.qty <= 0){
      delete CART[id];
    }
  }

  saveCart();
}
    
  
  async function processCheckout(customerName, customerPhone) {
  if (checkoutInProgress) return;
  
  checkoutInProgress = true;
  
  const btn = document.getElementById("checkoutBtn");
  if (btn) {
    btn.disabled = true;
    btn.innerText = "Procesando pedido...";
  }
  
    if(Object.keys(CART).length === 0){
    alert("El carrito está vacío");
    checkoutInProgress = false;
    if (btn) {
      btn.disabled = false;
      btn.innerText = "Finalizar por WhatsApp";
    }
    return;
  }
  
  
    // 🔒 confirmar stock (NO se devuelve)
    await confirmStock();
  
    // 👤 DATOS DEL CLIENTE
  if (!customerName) {
    alert("El nombre es obligatorio");
    checkoutInProgress = false;
    sessionStorage.removeItem("checkoutConfirmed");
    return;
  }
  
  if (!customerPhone) {
    alert("El celular es obligatorio");
    checkoutInProgress = false;
    sessionStorage.removeItem("checkoutConfirmed");
    return;
  }
  
    
    // 📦 crear pedido
    const orderId = await createOrder(customerName, customerPhone);
  
    // 📲 WhatsApp
    const now = new Date();
    const dateStr = now.toLocaleDateString("es-PE");
    const timeStr = now.toLocaleTimeString("es-PE",{hour:'2-digit',minute:'2-digit'});
  
    let msg = `Hola 👋%0A`;
    msg += `Cliente: ${customerName}%0A`;
    msg += `Celular: ${customerPhone}%0A%0A`;
    msg += `Pedido: *${orderId}*%0A`;
    msg += `Fecha: ${dateStr} ${timeStr}%0A%0A`;
    msg += `Productos:%0A`;
  
    Object.values(CART).forEach(p=>{
      msg += `• ${p.name} x${p.qty}%0A`;
    });
  
    // 🧹 limpiar carrito
    CART = {};
    localStorage.removeItem("cart");
    renderCart();
    renderAll();
    checkoutConfirmed = true;
    sessionStorage.setItem("checkoutConfirmed", "1");
  
  
    window.open(
    `https://wa.me/51963204461?text=${msg}`,
    "_blank"
  );
  
    checkoutInProgress = false;
  }
  
  
  function clearAfterCheckout(){
    CART = {};
    localStorage.removeItem("cart");
  
    checkoutInProgress = false;
  
    const btn = document.getElementById("checkoutBtn");
    if (btn) {
      btn.disabled = false;
      btn.innerText = "Finalizar por WhatsApp";
    }
  
    renderCart();
    renderAll();
  }
  
  
  
  async function saveOrder(orderId) {
    const items = [];
    let total = 0;
  
    Object.values(CART).forEach(p => {
      const price = p.discount ? p.finalPrice : p.price;
      items.push({
        name: p.name,
        qty: p.qty,
        price: price
      });
      total += price * p.qty;
    });
  
    await addDoc(collection(db, "orders"), {
      orderId: orderId,
      items: items,
      total: total,
      status: "pendiente",
      createdAt: serverTimestamp()
    });
  }
